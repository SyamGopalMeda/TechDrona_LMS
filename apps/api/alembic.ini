# Alembic config for Tech Drona LMS (ADR-0009: single environment at apps/api/migrations).
# The database URL is NOT stored here: env.py reads DATABASE_MIGRATION_URL (role td_owner),
# falling back to DATABASE_URL, or `-x url=...` on the command line.
#
#   alembic upgrade heads          # every module branch (conventions §4)
#   alembic heads / alembic branches

[alembic]
script_location = %(here)s/migrations
version_locations = %(here)s/migrations/versions
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
