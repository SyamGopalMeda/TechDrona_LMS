[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "techdrona-api"
version = "0.1.0"
description = "Tech Drona LMS API (FastAPI modular monolith)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1.0",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30,<2.2",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "argon2-cffi>=23.1",
  "redis>=5.0",
  "celery>=5.4",
  "httpx>=0.27",
  "structlog>=24.1",
  "pyotp>=2.9",
  "cryptography>=43",
  "boto3>=1.34",
  "fpdf2>=2.7",  # commerce: GST invoice / credit note PDFs (COM-16), pure Python
  "segno>=1.6",  # learning: QR code on certificate PDFs (pure Python; optional at runtime)
  "pyjwt[crypto]>=2.8",  # identity: Firebase Auth ID-token verification (Google sign-in)
  "pyuca>=1.2,<2",  # Postgres en_US.utf8 text ordering for Firestore in-memory sorts (app.core.firestore.collation)
  # Firestore migration (docs/firebase/MIGRATION-PLAN.md, P0): Admin SDK + async Firestore client.
  # Only app/core/firestore/ may use the Firestore client (tests/firestore/test_store_boundary.py).
  "firebase-admin>=6.5,<8",
  "google-cloud-firestore>=2.16,<3",
]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.25"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "ruff>=0.5",
  "mypy>=1.10",
  "coverage[toml]>=7.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions/*.mako"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = [
  "S101",   # assert is fine in tests
  "B008",   # FastAPI Depends() in defaults is idiomatic
  "RUF012", # mutable class attrs in pydantic/sqlalchemy models
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "E501", "S608"]
"migrations/**" = ["E501", "S608"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
strict_optional = true
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
filterwarnings = [
  "ignore::DeprecationWarning:passlib.*",
]

[tool.coverage.run]
source = ["app"]
branch = true
