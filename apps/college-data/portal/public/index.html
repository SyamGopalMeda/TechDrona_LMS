<!doctype html>
<html lang="en-IN">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/shell.css">

  <link rel="stylesheet" href="css/views-dashboard.css">

  <link rel="modulepreload" href="js/state.js">
  <link rel="modulepreload" href="js/ui/h.js">
  <link rel="modulepreload" href="js/ui/components.js">

<body>
  <a class="td-skip" href="#td-view">Skip to content</a>
  <div id="td-app" class="td-app" data-layout="full">
    <noscript><p style="padding:24px">The Tech Drona portal needs JavaScript enabled.</p></noscript>
    <div class="td-boot" aria-busy="true" role="status">
      <img class="td-logo-navy" src="assets/brand/mark-navy.svg" alt="" width="72" height="72">
      <img class="td-logo-white" src="assets/brand/mark-white.svg" alt="" width="72" height="72">
      <img class="td-boot__word td-logo-navy" src="assets/brand/wordmark-tagline-navy.svg" alt="Tech Drona — Debug your career. Deploy your dreams." width="220" height="41">
      <img class="td-boot__word td-logo-white" src="assets/brand/wordmark-tagline-white.svg" alt="Tech Drona — Debug your career. Deploy your dreams." width="220" height="41">
      <span class="td-boot__bar" aria-hidden="true"><span></span></span>
      <span class="td-sr-only">Loading the outreach portal…</span>
    </div>
  </div>
  <div id="td-overlays"></div>
  <div id="td-toasts" class="td-toasts" aria-live="polite"></div>
  <div id="td-announce" class="td-sr-only" aria-live="polite" aria-atomic="true"></div>
